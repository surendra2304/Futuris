services:
  postgres:
    image: postgres:16-alpine
    container_name: futuris_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: futuris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futuris"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futuris_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/futuris
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
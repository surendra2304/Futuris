services:
  futuris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futuris
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./data/futuris.db
      - OBJECT_STORE_PATH=./data/storage
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    networks:
      - friday_mesh

networks:
  friday_mesh:
    external: true
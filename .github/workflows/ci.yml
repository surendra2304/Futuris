name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Dependencies are installed from uv.lock with `uv sync --frozen`, so CI runs the
# versions the repository pins. (The previous `pip install -e ".[dev]"` resolved the
# latest releases instead, so CI and the lock could disagree.) uv is pinned to the
# version that wrote the revision-5 lock; bump it deliberately together with the lock.
env:
  UV_VERSION: "0.12.24"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (whole repository, hard gate)
        run: uv run --frozen ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev

      # The gate sits 5 points under the measured baseline (80%, round 2) so that
      # ordinary churn does not flap, while a large untested addition still fails.
      - name: Test with coverage gate
        run: uv run --frozen pytest --cov=futuris --cov-report=term-missing --cov-fail-under=75

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Export locked requirements
        run: uv export --frozen --extra dev --no-hashes --no-emit-project -o requirements-locked.txt

      - name: Audit Python dependencies against known advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-locked.txt --progress-spinner off

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futuris/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: futuris/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      # Gate on production dependencies. Development-toolchain advisories (vite,
      # tailwind, esbuild) are reported separately in REPO_ANALYSIS.md, §19.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
